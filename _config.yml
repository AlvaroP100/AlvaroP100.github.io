title: "Alvaro Patru / Alvaro P100"
description: "The personal website of Alvaro Patru, also known online as Alvaro P100, focused on software, infrastructure, data, security, automation, and AI."
url: "https://alvarop100.github.io"
baseurl: ""
lang: "en"
timezone: "Europe/Berlin"

indexing: false

permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      noindex: true
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SEO_CHECKLIST.md
  - outputs
  - work
