<footer class="site-footer">
  <div class="container footer-shell">
    <div>
      <p class="footer-name">{{ site.data.profile.name }}</p>
      <p class="footer-note">Built with plain HTML, CSS, and GitHub Pages.</p>
    </div>
    <nav class="social-links" aria-label="Social profiles">
      {% for social in site.data.profile.socials %}
        <a href="{{ social.url }}" rel="me noopener" target="_blank">{{ social.name }}</a>
      {% endfor %}
    </nav>
  </div>
</footer>
