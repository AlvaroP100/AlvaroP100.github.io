<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="container nav-shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }} home">
      <span class="brand-full">{{ site.data.profile.name }}</span>
      <span class="brand-short" aria-hidden="true">{{ site.data.profile.short_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a {% if page.url == '/about/' %}aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">Theme</button>
    </nav>
  </div>
</header>
