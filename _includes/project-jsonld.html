{% assign person_id = '/' | absolute_url | append: '#person' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CreativeWork",
  "@id": {{ canonical_url | append: '#project' | jsonify }},
  "url": {{ canonical_url | jsonify }},
  "name": {{ page.title | jsonify }},
  "description": {{ seo_description | jsonify }},
  "image": {{ seo_image_url | jsonify }},
  "creator": {
    "@type": "Person",
    "@id": {{ person_id | jsonify }},
    "name": {{ site.data.profile.name | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}
  }{% if page.stack %},
  "keywords": {{ page.stack | join: ', ' | jsonify }}{% endif %}
}
</script>
